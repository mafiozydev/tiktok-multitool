<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Multitool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.setHeaderColor("#1a1a1a");
    }
  </script>
</head>
<body class="bg-[#1a1a1a] text-white min-h-screen">
  <div class="max-w-lg mx-auto p-4">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold bg-gradient-to-r from-pink-500 to-violet-500 bg-clip-text text-transparent">
        TikTok Multitool
      </h1>
      <p class="text-gray-400 text-sm">Всё работает у тебя на устройстве</p>
    </div>

    <div class="bg-[#252525] rounded-3xl p-6 shadow-xl">
      <input id="urlInput" type="text" placeholder="Вставь ссылку на TikTok видео" 
             class="w-full bg-[#1a1a1a] border border-gray-600 rounded-2xl px-5 py-4 text-white placeholder-gray-500 focus:outline-none focus:border-pink-500">
      
      <button onclick="analyzeVideo()" 
              class="w-full mt-4 bg-gradient-to-r from-pink-500 to-violet-500 hover:from-pink-600 hover:to-violet-600 py-4 rounded-2xl font-bold text-lg active:scale-95 transition">
        🚀 Анализировать видео
      </button>
    </div>

    <div id="result" class="hidden mt-6 bg-[#252525] rounded-3xl p-6"></div>
  </div>

  <script>
    let currentAudioUrl = '';

    async function analyzeVideo() {
      const input = document.getElementById('urlInput');
      const resultDiv = document.getElementById('result');
      const url = input.value.trim();

      if (!url.includes('tiktok.com')) {
        alert('❌ Это не ссылка на TikTok');
        return;
      }

      resultDiv.classList.remove('hidden');
      resultDiv.innerHTML = `
        <div class="flex items-center justify-center py-8">
          <div class="animate-spin rounded-full h-10 w-10 border-t-4 border-pink-500"></div>
          <span class="ml-4 text-lg">Анализируем... (всё на твоём устройстве)</span>
        </div>`;

      try {
        const apiUrl = `https://tikwm.com/api/?url=${encodeURIComponent(url)}`;
        const res = await fetch(apiUrl);
        const data = await res.json();

        if (data.code !== 0 || !data.data) throw new Error();

        const video = data.data;
        const musicTitle = video.music_info?.title || 'Оригинальный звук';
        const musicAuthor = video.music_info?.author || 'TikTok';
        currentAudioUrl = video.music || video.music_info?.play || '';

        let html = `
          <div class="space-y-6">
            <div>
              <h2 class="text-xl font-semibold">🎵 Музыка</h2>
              <p class="text-2xl font-bold">${musicTitle}</p>
              <p class="text-gray-400">${musicAuthor}</p>
            </div>

            <div class="grid grid-cols-1 gap-3">
              ${currentAudioUrl ? `
                <button onclick="playAudio()" 
                        class="bg-blue-600 hover:bg-blue-700 py-4 rounded-2xl font-bold flex items-center justify-center gap-2">
                  ▶ Воспроизвести аудио
                </button>
                
                <button onclick="downloadTikTokAudio()" 
                        class="bg-green-600 hover:bg-green-700 py-4 rounded-2xl font-bold flex items-center justify-center gap-2">
                  📥 Скачать аудиодорожку TikTok
                </button>

                <button onclick="startShazamFlow()" 
                        class="bg-amber-600 hover:bg-amber-700 py-4 rounded-2xl font-bold flex items-center justify-center gap-2">
                  🎤 Распознать в Shazam
                </button>` : ''}

              <button onclick="searchFullSong('${musicTitle}', '${musicAuthor}')" 
                      class="bg-violet-600 hover:bg-violet-700 py-4 rounded-2xl font-bold">
                🔎 Найти полную версию песни (YouTube)
              </button>
            </div>

            <div class="text-xs text-gray-400 pt-4 border-t border-gray-700">
              📼 Название видео: ${video.title || '—'}<br>
              👤 Автор: ${video.author?.nickname || '—'}
            </div>
          </div>`;

        resultDiv.innerHTML = html;

      } catch (e) {
        resultDiv.innerHTML = `<p class="text-red-500 text-center py-8">❌ Не удалось получить данные.<br>Попробуй другую ссылку.</p>`;
      }
    }

    function playAudio() {
      if (!currentAudioUrl) return;
      const audio = new Audio(currentAudioUrl);
      audio.play();
    }

    function downloadTikTokAudio() {
      if (!currentAudioUrl) return;
      const a = document.createElement('a');
      a.href = currentAudioUrl;
      a.download = 'tiktok_original_sound.mp3';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function startShazamFlow() {
      if (!currentAudioUrl) return;
      
      const audio = new Audio(currentAudioUrl);
      audio.play();

      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = `
        <div class="text-center py-8">
          <div class="text-5xl mb-6">🔊</div>
          <h3 class="text-2xl font-bold mb-3">Аудио уже играет</h3>
          <p class="text-gray-400 mb-8">Теперь открой приложение Shazam и нажми «Распознать»</p>
          
          <a href="shazam://" 
             class="block w-full bg-[#00AEEF] text-white py-6 rounded-3xl text-2xl font-bold mb-6 active:scale-95 transition">
            📱 Открыть Shazam
          </a>
          
          <button onclick="analyzeVideo()" class="text-gray-400 underline">
            ← Вернуться к результату
          </button>
        </div>`;
    }

    function searchFullSong(title, author) {
      const query = encodeURIComponent(`${title} ${author}`);
      window.open(`https://www.youtube.com/results?search_query=${query}`, '_blank');
    }
  </script>
</body>
</html>
