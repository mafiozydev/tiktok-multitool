<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Multitool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.setHeaderColor("#1a1a1a");
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-[#1a1a1a] text-white min-h-screen">
  <div class="max-w-lg mx-auto p-4">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold bg-gradient-to-r from-pink-500 to-violet-500 bg-clip-text text-transparent">
        TikTok Multitool
      </h1>
      <p class="text-gray-400 text-sm">Всё анализируется у тебя на устройстве</p>
    </div>

    <div class="bg-[#252525] rounded-3xl p-6 shadow-xl">
      <input id="urlInput" type="text" placeholder="Вставь ссылку на TikTok видео" 
             class="w-full bg-[#1a1a1a] border border-gray-600 rounded-2xl px-5 py-4 text-white placeholder-gray-500 focus:outline-none focus:border-pink-500">
      
      <button onclick="analyzeVideo()" 
              class="w-full mt-4 bg-gradient-to-r from-pink-500 to-violet-500 hover:from-pink-600 hover:to-violet-600 py-4 rounded-2xl font-bold text-lg active:scale-95 transition">
        🚀 Анализировать видео
      </button>
    </div>

    <div id="result" class="hidden mt-6 bg-[#252525] rounded-3xl p-6"></div>
  </div>

  <script>
    async function analyzeVideo() {
      const input = document.getElementById('urlInput');
      const resultDiv = document.getElementById('result');
      const url = input.value.trim();

      if (!url.includes('tiktok.com')) {
        alert('❌ Это не ссылка на TikTok');
        return;
      }

      resultDiv.classList.remove('hidden');
      resultDiv.innerHTML = `
        <div class="flex items-center justify-center py-8">
          <div class="animate-spin rounded-full h-10 w-10 border-t-4 border-pink-500"></div>
          <span class="ml-4 text-lg">Анализируем... (всё на твоём устройстве)</span>
        </div>`;

      try {
        // Используем надёжный API tikwm.com
        const apiUrl = `https://tikwm.com/api/?url=${encodeURIComponent(url)}`;
        const res = await fetch(apiUrl);
        const data = await res.json();

        if (data.code !== 0 || !data.data) throw new Error();

        const video = data.data;
        const musicUrl = video.music || video.music_info?.play || '';

        let html = `
          <div class="space-y-6">
            <div>
              <h2 class="text-xl font-semibold">🎵 Музыка</h2>
              <p class="text-2xl font-bold">${video.music_info?.title || 'Оригинальный звук'}</p>
              <p class="text-gray-400">${video.music_info?.author || 'TikTok'}</p>
            </div>

            <div class="flex gap-3">
              ${musicUrl ? `
                <button onclick="downloadAudio('${musicUrl}', '${video.music_info?.title || 'original_sound'}')" 
                        class="flex-1 bg-green-600 hover:bg-green-700 py-4 rounded-2xl font-bold flex items-center justify-center gap-2">
                  📥 Скачать оригинальный звук
                </button>` : ''}
              
              <button onclick="copyTrack('${video.music_info?.title || ''} - ${video.music_info?.author || ''}')" 
                      class="flex-1 bg-gray-700 hover:bg-gray-600 py-4 rounded-2xl font-bold">
                📋 Копировать название трека
              </button>
            </div>

            <div class="text-xs text-gray-400">
              📼 Название видео: ${video.title || '—'}<br>
              👤 Автор: ${video.author?.nickname || '—'}
            </div>
          </div>`;

        resultDiv.innerHTML = html;

      } catch (e) {
        resultDiv.innerHTML = `<p class="text-red-500 text-center py-8">❌ Не удалось получить данные.<br>Попробуй другую ссылку.</p>`;
      }
    }

    function downloadAudio(url, title) {
      const a = document.createElement('a');
      a.href = url;
      a.download = `${title.replace(/[^a-zA-Z0-9]/g, '_')}.mp3`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function copyTrack(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('✅ Название трека скопировано!');
      });
    }

    // Автозапуск, если Telegram передал ссылку
    window.Telegram?.WebApp?.onEvent('themeChanged', () => {});
  </script>
</body>
</html>
