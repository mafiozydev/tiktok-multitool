<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Multitool</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: system-ui; padding: 20px; background: #000; color: white; }
    </style>
</head>
<body>
    <h1>TikTok Audio Analyzer</h1>
    <div id="status">Загрузка...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        async function analyzeTikTok(url) {
            const status = document.getElementById('status');
            status.textContent = 'Анализируем музыку... (всё на твоём устройстве)';

            try {
                // Пример: используем публичный TikTok API (client-side)
                const apiUrl = `https://api.tiklydown.eu.org/api/download?url=${encodeURIComponent(url)}`;
                const res = await fetch(apiUrl);
                const data = await res.json();

                let music = data.data?.music || data.data?.musicInfo?.title || 'Не найдено';
                let artist = data.data?.musicInfo?.author || 'Неизвестно';

                status.innerHTML = `
                    <h2>✅ Готово</h2>
                    <p><strong>🎵 Трек:</strong> ${music}</p>
                    <p><strong>👤 Исполнитель:</strong> ${artist}</p>
                `;
            } catch(e) {
                status.textContent = 'Ошибка: ' + e.message;
            }
        }

        // Получаем параметры из Telegram (startParam или initData)
        const urlParams = new URLSearchParams(window.location.search);
        const tiktokUrl = urlParams.get('url') || tg.initDataUnsafe.start_param;

        if (tiktokUrl) {
            analyzeTikTok(decodeURIComponent(tiktokUrl));
        } else {
            document.getElementById('status').textContent = 'Пришли ссылку на TikTok через бота';
        }
    </script>
</body>
</html>
